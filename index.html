<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Status — Elpris DK1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720;
    --panel:#161f2b;
    --panel-2:#1d2836;
    --line: #2a3646;
    --text:#e9edf1;
    --text-dim:#8a96a3;
    --cheap:#33d6b0;
    --mid:#e9c65a;
    --expensive:#e8624f;
    --accent:#5ac8fa;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(90,200,250,0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(232,98,79,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- LOGIN ---------- */
  #login-screen{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .grid-mark{
    width:34px; height:34px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--accent), var(--cheap));
    display:flex;align-items:center;justify-content:center;
    font-weight:700; font-size:15px; color:#0f1720;
    margin-bottom:18px;
  }
  #login-screen h1{
    font-size:20px; margin:0 0 4px 0; font-weight:600; letter-spacing:-0.01em;
  }
  #login-screen p.sub{
    color:var(--text-dim); font-size:13px; margin:0 0 26px 0;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text-dim); margin-bottom:6px;
  }
  .field input{
    width:100%; padding:11px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    font-family:'IBM Plex Mono', monospace; font-size:14px;
    outline:none;
  }
  .field input:focus{ border-color:var(--accent); }
  #login-btn{
    width:100%; padding:12px; border:none; border-radius:8px; cursor:pointer;
    background:var(--accent); color:#0f1720; font-weight:600; font-size:14px;
    font-family:'Space Grotesk', sans-serif; margin-top:6px;
  }
  #login-btn:hover{ filter:brightness(1.08); }
  #login-error{
    color:var(--expensive); font-size:12.5px; margin-top:12px; display:none;
  }

  /* ---------- DASHBOARD ---------- */
  #dashboard{ width:100%; max-width:920px; display:none; }
  .top-row{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .eyebrow{
    font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--text-dim); margin-bottom:6px;
  }
  .top-row h1{ font-size:26px; margin:0; font-weight:600; letter-spacing:-0.01em;}
  #logout-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12.5px;
    font-family:'Space Grotesk', sans-serif;
  }
  #logout-btn:hover{ color:var(--text); border-color:var(--text-dim); }

  .now-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:26px 28px; margin-bottom:18px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px;
  }
  .now-price{ display:flex; align-items:baseline; gap:10px; }
  .now-price .big{ font-size:44px; font-weight:700; font-family:'IBM Plex Mono', monospace; }
  .now-price .unit{ color:var(--text-dim); font-size:14px; }
  .now-tag{
    padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;
    font-family:'IBM Plex Mono', monospace;
  }
  .tag-cheap{ background:rgba(51,214,176,0.15); color:var(--cheap); }
  .tag-mid{ background:rgba(233,198,90,0.15); color:var(--mid); }
  .tag-expensive{ background:rgba(232,98,79,0.15); color:var(--expensive); }

  .stat{ text-align:right; }
  .stat .label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; }
  .stat .value{ font-family:'IBM Plex Mono', monospace; font-size:15px; margin-top:2px; }

  .chart-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:24px 24px 10px 24px; margin-bottom:18px;
  }
  .chart-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .chart-head h2{ font-size:14px; margin:0; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
  .chart-head .date{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--text-dim); }

  #chart-wrap{ width:100%; }
  #chart-svg{ width:100%; height:220px; display:block; }

  .footline{
    display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace; padding:10px 2px 14px 2px;
  }
  .footline b{ color:var(--text); }

  #load-msg, #error-msg{
    color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;
  }
  #error-msg{ color:var(--expensive); display:none; }

  @media (max-width:520px){
    .now-price .big{ font-size:34px; }
    .top-row h1{ font-size:21px; }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="grid-mark">⚡</div>
    <h1>Status</h1>
    <p class="sub">Log ind for at se dagens elpris.</p>
    <div class="field">
      <label for="user">Brugernavn</label>
      <input id="user" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label for="pass">Adgangskode</label>
      <input id="pass" type="password" autocomplete="current-password" />
    </div>
    <button id="login-btn">Log ind</button>
    <div id="login-error">Forkert brugernavn eller adgangskode.</div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="top-row">
      <div>
        <div class="eyebrow">Camilo · Vildbjerg · DK1</div>
        <h1>Elpris i dag</h1>
      </div>
      <button id="logout-btn">Log ud</button>
    </div>

    <div id="load-msg">Henter priser…</div>
    <div id="error-msg">Kunne ikke hente priser lige nu. Prøv igen om lidt.</div>

    <div id="content" style="display:none;">
      <div class="now-card">
        <div>
          <div class="eyebrow">Lige nu — <span id="now-hour" class="mono"></span></div>
          <div class="now-price">
            <span class="big mono" id="now-price">--</span>
            <span class="unit">øre/kWh</span>
            <span class="now-tag" id="now-tag">—</span>
          </div>
        </div>
        <div style="display:flex; gap:28px;">
          <div class="stat">
            <div class="label">Billigst</div>
            <div class="value" id="best-stat">—</div>
          </div>
          <div class="stat">
            <div class="label">Dyrest</div>
            <div class="value" id="worst-stat">—</div>
          </div>
          <div class="stat">
            <div class="label">Gennemsnit</div>
            <div class="value" id="avg-stat">—</div>
          </div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <h2>Timepris</h2>
          <span class="date mono" id="chart-date"></span>
        </div>
        <div id="chart-wrap">
          <svg id="chart-svg" viewBox="0 0 720 220" preserveAspectRatio="none"></svg>
        </div>
        <div class="footline">
          <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const USER = "camilo";
  const PASS = "rojas";
  const SESSION_KEY = "watt_status_session";

  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const loginError = document.getElementById('login-error');

  function showDashboard(){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    loadPrices();
  }
  function showLogin(){
    dashboard.style.display = 'none';
    loginScreen.style.display = 'block';
  }

  loginBtn.addEventListener('click', function(){
    const u = document.getElementById('user').value.trim().toLowerCase();
    const p = document.getElementById('pass').value;
    if(u === USER && p === PASS){
      sessionStorage.setItem(SESSION_KEY, '1');
      loginError.style.display = 'none';
      showDashboard();
    } else {
      loginError.style.display = 'block';
    }
  });

  document.getElementById('pass').addEventListener('keydown', function(e){
    if(e.key === 'Enter') loginBtn.click();
  });

  logoutBtn.addEventListener('click', function(){
    sessionStorage.removeItem(SESSION_KEY);
    showLogin();
  });

  if(sessionStorage.getItem(SESSION_KEY) === '1'){
    showDashboard();
  }

  // ---------- PRICE FETCH ----------
  async function loadPrices(){
    const loadMsg = document.getElementById('load-msg');
    const errorMsg = document.getElementById('error-msg');
    const content = document.getElementById('content');

    const today = new Date();
    const start = today.toISOString().slice(0,10);
    const endDate = new Date(today);
    endDate.setDate(endDate.getDate()+1);
    const end = endDate.toISOString().slice(0,10);

    const url = `https://api.energidataservice.dk/dataset/DayAheadPrices?start=${start}&end=${end}&filter={"PriceArea":["DK1"]}&sort=TimeDK asc&limit=0`;

    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      const records = (data.records || []).filter(r => r.TimeDK && r.TimeDK.slice(0,10) === start);
      if(records.length === 0) throw new Error('no records');

      loadMsg.style.display = 'none';
      content.style.display = 'block';
      renderDashboard(records, start);
    }catch(err){
      loadMsg.style.display = 'none';
      errorMsg.style.display = 'block';
      console.error(err);
    }
  }

  function eurMwhToOreKwh(eur){
    // EUR/MWh -> DKK/MWh (approx 7.46) -> øre/kWh
    const dkkMwh = eur * 7.46;
    return dkkMwh / 10; // DKK/MWh / 1000 * 100 øre = /10
  }

  function renderDashboard(records, dateStr){
    const prices = records.map(r => {
      const dkk = (r.DayAheadPriceDKK ?? r.SpotPriceDKK);
      const val = (dkk !== undefined && dkk !== null)
        ? dkk / 10
        : eurMwhToOreKwh(r.DayAheadPriceEUR ?? r.PriceEUR ?? 0);
      return { hour: r.TimeDK.slice(11,16), value: val };
    });

    const now = new Date();
    const currentHour = now.getHours();
    const currentIdx = Math.min(currentHour, prices.length-1);

    const values = prices.map(p=>p.value);
    const avg = values.reduce((a,b)=>a+b,0)/values.length;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const minIdx = values.indexOf(min);
    const maxIdx = values.indexOf(max);

    const nowVal = prices[currentIdx] ? prices[currentIdx].value : avg;
    document.getElementById('now-hour').textContent = prices[currentIdx] ? prices[currentIdx].hour : '--:--';
    document.getElementById('now-price').textContent = nowVal.toFixed(1);

    const tagEl = document.getElementById('now-tag');
    if(nowVal <= avg * 0.7){ tagEl.textContent = 'Billig'; tagEl.className='now-tag tag-cheap'; }
    else if(nowVal >= avg * 1.3){ tagEl.textContent = 'Dyr'; tagEl.className='now-tag tag-expensive'; }
    else { tagEl.textContent = 'Middel'; tagEl.className='now-tag tag-mid'; }

    document.getElementById('best-stat').textContent = `${min.toFixed(1)} øre (${prices[minIdx].hour})`;
    document.getElementById('worst-stat').textContent = `${max.toFixed(1)} øre (${prices[maxIdx].hour})`;
    document.getElementById('avg-stat').textContent = `${avg.toFixed(1)} øre`;

    document.getElementById('chart-date').textContent = dateStr;

    drawChart(prices, avg, currentIdx);
  }

  function drawChart(prices, avg, currentIdx){
    const svg = document.getElementById('chart-svg');
    const W = 720, H = 220, padTop = 14, padBottom = 10;
    const n = prices.length;
    const values = prices.map(p=>p.value);
    const max = Math.max(...values, avg);
    const min = Math.min(0, Math.min(...values));
    const range = (max - min) || 1;

    const x = i => (i/(n-1)) * W;
    const y = v => H - padBottom - ((v - min)/range) * (H - padTop - padBottom);

    let stepPath = `M0,${y(values[0])}`;
    for(let i=0;i<n;i++){
      stepPath += ` L${x(i)},${y(values[i])}`;
      if(i < n-1) stepPath += ` L${x(i+1)},${y(values[i])}`;
    }
    const areaPath = stepPath + ` L${W},${H} L0,${H} Z`;

    const avgY = y(avg);
    const curX = x(currentIdx);

    const svgNS = "http://www.w3.org/2000/svg";
    while(svg.firstChild) svg.removeChild(svg.firstChild);

    const defs = document.createElementNS(svgNS, 'defs');
    defs.innerHTML = `
      <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5ac8fa" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#5ac8fa" stop-opacity="0"/>
      </linearGradient>`;
    svg.appendChild(defs);

    const area = document.createElementNS(svgNS,'path');
    area.setAttribute('d', areaPath);
    area.setAttribute('fill', 'url(#fillGrad)');
    svg.appendChild(area);

    const avgLine = document.createElementNS(svgNS,'line');
    avgLine.setAttribute('x1',0); avgLine.setAttribute('x2',W);
    avgLine.setAttribute('y1',avgY); avgLine.setAttribute('y2',avgY);
    avgLine.setAttribute('stroke','#8a96a3');
    avgLine.setAttribute('stroke-dasharray','4 4');
    avgLine.setAttribute('stroke-width','1');
    svg.appendChild(avgLine);

    const curLine = document.createElementNS(svgNS,'line');
    curLine.setAttribute('x1',curX); curLine.setAttribute('x2',curX);
    curLine.setAttribute('y1',0); curLine.setAttribute('y2',H);
    curLine.setAttribute('stroke','#5ac8fa');
    curLine.setAttribute('stroke-width','1.5');
    curLine.setAttribute('opacity','0.5');
    svg.appendChild(curLine);

    const line = document.createElementNS(svgNS,'path');
    line.setAttribute('d', stepPath);
    line.setAttribute('fill','none');
    line.setAttribute('stroke', '#5ac8fa');
    line.setAttribute('stroke-width','2');
    svg.appendChild(line);

    const dot = document.createElementNS(svgNS,'circle');
    dot.setAttribute('cx', curX);
    dot.setAttribute('cy', y(values[currentIdx]));
    dot.setAttribute('r', 5);
    dot.setAttribute('fill', '#0f1720');
    dot.setAttribute('stroke', '#5ac8fa');
    dot.setAttribute('stroke-width', '2.5');
    svg.appendChild(dot);
  }
})();
</script>
</body>
</html>
